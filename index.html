function initAdminListeners() {
    const container = document.getElementById('pageContainer');

    const exportAllJsonBtn = document.getElementById('exportAllJsonBtn');
    if (exportAllJsonBtn) {
        exportAllJsonBtn.addEventListener('click', () => {
            if (!confirm(`確定要匯出全部資料備份嗎？\n共 ${carts.length} 台急救車。`)) return;
            exportAllToJson();
        });
    }

    const importJsonBtn = document.getElementById('importJsonBtn');
    if (importJsonBtn) {
        importJsonBtn.addEventListener('click', () => {
            document.getElementById('importJsonInput').click();
        });
    }

    const batchDeleteAll = document.getElementById('batchDeleteAll');
    if (batchDeleteAll) {
        batchDeleteAll.addEventListener('change', () => {
            container.querySelectorAll('.batch-delete-cart').forEach(cb => {
                cb.checked = batchDeleteAll.checked;
            });
        });
    }
    const batchDateAll = document.getElementById('batchDateAll');
    if (batchDateAll) {
        batchDateAll.addEventListener('change', () => {
            container.querySelectorAll('.batch-date-cart').forEach(cb => {
                cb.checked = batchDateAll.checked;
            });
        });
    }
    const batchAddBtn = document.getElementById('batchAddBtn');
    if (batchAddBtn) {
        batchAddBtn.addEventListener('click', () => {
            const count = parseInt(document.getElementById('batchAddCount').value, 10);
            const prefix = document.getElementById('batchAddPrefix').value.trim() || '急救車';
            if (isNaN(count) || count < 1) { alert('請輸入有效的數量（至少 1）'); return; }
            if (count > 50) { alert('一次最多新增 50 台'); return; }
            const startIndex = carts.length + 1;
            const createdNames = [];
            for (let i = 0; i < count; i++) {
                const name = `${prefix}-${String(startIndex + i).padStart(2, '0')}`;
                carts.push(createFullCart(name));
                createdNames.push(name);
            }
            saveToLocalStorage();
            addLog('create', '管理功能', `批量新增 ${count} 台急救車：${createdNames.join('、')}`);
            alert(`已新增 ${count} 台急救車`);
            render();
        });
    }
    const batchDeleteBtn = document.getElementById('batchDeleteBtn');
    if (batchDeleteBtn) {
        batchDeleteBtn.addEventListener('click', () => {
            const checked = Array.from(container.querySelectorAll('.batch-delete-cart:checked'))
                .map(cb => cb.value);
            if (checked.length === 0) { alert('請先勾選要刪除的急救車'); return; }
            const names = checked.map(id => {
                const c = carts.find(x => x.id === id);
                return c ? c.name : id;
            });
            if (!confirm(`確定刪除以下 ${checked.length} 台急救車嗎？\n${names.join('、')}`)) return;
            carts = carts.filter(c => !checked.includes(c.id));
            saveToLocalStorage();
            addLog('delete', '管理功能', `批量刪除 ${checked.length} 台急救車：${names.join('、')}`);
            alert(`已刪除 ${checked.length} 台急救車`);
            if (carts.length === 0) activeTab = 'overview';
            else if (activeTab.startsWith('cart:')) {
                currentCartIndex = Math.min(currentCartIndex, carts.length - 1);
            }
            render();
        });
    }
    const batchDateBtn = document.getElementById('batchDateBtn');
    if (batchDateBtn) {
        batchDateBtn.addEventListener('click', () => {
            const itemName = document.getElementById('batchItemSelect').value;
            const newDate = document.getElementById('batchNewDate').value;
            const checked = Array.from(container.querySelectorAll('.batch-date-cart:checked'))
                .map(cb => cb.value);
            if (!itemName) { alert('請選擇物品'); return; }
            if (!newDate) { alert('請輸入新有效日期'); return; }
            if (checked.length === 0) { alert('請勾選要套用的急救車'); return; }
            let updatedCount = 0;
            const updatedCarts = [];
            checked.forEach(cartId => {
                const cart = carts.find(c => c.id === cartId);
                if (!cart) return;
                let changed = false;
                Object.keys(cart.items).forEach(k => {
                    (cart.items[k] || []).forEach(it => {
                        if (it.name === itemName) {
                            it.expiry = newDate;
                            it.outOfStock = false;
                            updatedCount++;
                            changed = true;
                        }
                    });
                });
                if (changed) updatedCarts.push(cart.name);
            });
            saveToLocalStorage();
            addLog('update', '管理功能',
                `批量修改物品「${itemName}」有效日期為 ${newDate}，套用於 ${updatedCarts.length} 台急救車（共 ${updatedCount} 筆）`);
            alert(`已更新 ${updatedCount} 筆物品日期，套用於 ${updatedCarts.length} 台急救車`);
            render();
        });
    }
}

/* ============================================================
   日期輸入處理
   ============================================================ */
function getSegEls(cartId, section, itemId) {
    const yEl = document.querySelector(`input[data-cart-id="${cartId}"][data-section="${section}"][data-item-id="${itemId}"][data-field="dateYear"]`);
    const mEl = document.querySelector(`input[data-cart-id="${cartId}"][data-section="${section}"][data-item-id="${itemId}"][data-field="dateMonth"]`);
    const dEl = document.querySelector(`input[data-cart-id="${cartId}"][data-section="${section}"][data-item-id="${itemId}"][data-field="dateDay"]`);
    return { yEl, mEl, dEl };
}

function getSegValues(cartId, section, itemId) {
    const { yEl, mEl, dEl } = getSegEls(cartId, section, itemId);
    return {
        y: yEl ? yEl.value.trim() : '',
        m: mEl ? mEl.value.trim() : '',
        d: dEl ? dEl.value.trim() : ''
    };
}

function commitDateSeg(cartId, section, itemId, autoFillDay) {
    const item = findItem(cartId, section, itemId);
    if (!item) return null;
    const cart = carts.find(c => c.id === cartId);
    const { yEl, mEl, dEl } = getSegEls(cartId, section, itemId);
    let vals = getSegValues(cartId, section, itemId);
    let y = vals.y, m = vals.m, d = vals.d;

    if (/^\d{2}$/.test(y)) {
        y = '20' + y;
        if (yEl) yEl.value = y;
    }
    const yNum = parseInt(y, 10);
    const mNum = parseInt(m, 10);
    let dNum = parseInt(d, 10);

    if (!y || isNaN(yNum)) {
        item.expiry = '';
        saveToLocalStorage();
        updateRowDisplay(cartId, section, itemId);
        return { y: '', m: '', d: '' };
    }

    if (!m || isNaN(mNum)) {
        if (item.expiry !== '') {
            item.expiry = '';
            saveToLocalStorage();
            updateRowDisplay(cartId, section, itemId);
        }
        return null;
    }

    if (mNum < 1) mNum = 1;
    if (mNum > 12) mNum = 12;
    const lastDay = getLastDayOfMonth(yNum, mNum);

    if (!d || isNaN(dNum)) {
        if (autoFillDay) {
            dNum = lastDay;
            d = String(dNum);
            if (dEl) dEl.value = d;
        } else {
            return null;
        }
    }

    if (dNum < 1) dNum = 1;
    if (dNum > lastDay) {
        dNum = lastDay;
        d = String(dNum);
        if (dEl) dEl.value = d;
    }

    const finalY = y;
    const finalM = String(mNum);
    const finalD = String(dNum);

    const newExpiry = formatDateStr(finalY, finalM, finalD);
    const oldExpiry = item.expiry;

    if (oldExpiry !== newExpiry) {
        item.expiry = newExpiry;
        saveToLocalStorage();
        addLog('update', cart ? cart.name : '',
            `有效日期「${item.name}」：${oldExpiry || '(空)'} → ${newExpiry}`);
        if (mEl && mEl.value !== finalM) mEl.value = finalM;
    }

    updateRowDisplay(cartId, section, itemId);
    return { y: finalY, m: finalM, d: finalD };
}

function focusNextDateYear(cartId, section, itemId) {
    const container = document.getElementById('pageContainer');
    const allYears = Array.from(container.querySelectorAll('.date-seg.year:not([disabled])'));
    const currentYear = document.querySelector(`input[data-cart-id="${cartId}"][data-section="${section}"][data-item-id="${itemId}"][data-field="dateYear"]`);
    if (!currentYear) return;
    const idx = allYears.indexOf(currentYear);
    if (idx >= 0 && idx < allYears.length - 1) {
        const next = allYears[idx + 1];
        next.focus();
    } else {
        currentYear.blur();
    }
}

/* ============================================================
   事件處理
   ============================================================ */
function initGlobalListeners() {
    const container = document.getElementById('pageContainer');

    container.addEventListener('focusin', e => {
        const t = e.target;
        if (t.matches('.date-seg') || t.matches('.qty-input') || t.matches('.number-input')) {
            setTimeout(() => {
                if (typeof t.select === 'function') t.select();
            }, 0);
        }
    });

    container.addEventListener('input', e => {
        const t = e.target;

        if (t.matches('.date-seg')) {
            const { cartId, section, itemId, field } = t.dataset;
            let v = t.value.replace(/[^\d]/g, '');
            if (field === 'dateYear') v = v.slice(0, 4);
            else v = v.slice(0, 2);
            if (t.value !== v) t.value = v;

            if (field === 'dateYear') {
                if (v.length === 2) {
                    const full = '20' + v;
                    t.value = full;
                    commitDateSeg(cartId, section, itemId, false);
                    const { mEl } = getSegEls(cartId, section, itemId);
                    if (mEl) {
                        mEl.focus();
                        setTimeout(() => { if (typeof mEl.select === 'function') mEl.select(); }, 0);
                    }
                    return;
                }
                if (v.length === 4) {
                    commitDateSeg(cartId, section, itemId, false);
                    const { mEl } = getSegEls(cartId, section, itemId);
                    if (mEl) {
                        mEl.focus();
                        setTimeout(() => { if (typeof mEl.select === 'function') mEl.select(); }, 0);
                    }
                    return;
                }
                commitDateSeg(cartId, section, itemId, false);
                return;
            }

            if (field === 'dateMonth') {
                if (v.length === 0) {
                    commitDateSeg(cartId, section, itemId, false);
                    return;
                }
                const first = v[0];
                const mNum = parseInt(v, 10);

                if (first === '0' || first === '1') {
                    if (v.length === 2 && !isNaN(mNum) && mNum >= 1 && mNum <= 12) {
                        commitDateSeg(cartId, section, itemId, false);
                        const { dEl } = getSegEls(cartId, section, itemId);
                        if (dEl) {
                            dEl.focus();
                            setTimeout(() => { if (typeof dEl.select === 'function') dEl.select(); }, 0);
                        }
                        return;
                    }
                    commitDateSeg(cartId, section, itemId, false);
                    return;
                }

                if (v.length === 1 && first >= '2' && first <= '9') {
                    t.value = '0' + v;
                    commitDateSeg(cartId, section, itemId, false);
                    const { dEl } = getSegEls(cartId, section, itemId);
                    if (dEl) {
                        dEl.focus();
                        setTimeout(() => { if (typeof dEl.select === 'function') dEl.select(); }, 0);
                    }
                    return;
                }

                if (v.length === 2 && !isNaN(mNum) && mNum >= 1 && mNum <= 12) {
                    commitDateSeg(cartId, section, itemId, false);
                    const { dEl } = getSegEls(cartId, section, itemId);
                    if (dEl) {
                        dEl.focus();
                        setTimeout(() => { if (typeof dEl.select === 'function') dEl.select(); }, 0);
                    }
                    return;
                }

                commitDateSeg(cartId, section, itemId, false);
                return;
            }

            if (field === 'dateDay') {
                commitDateSeg(cartId, section, itemId, false);
                return;
            }

            return;
        }

        if (!t.matches('.item-name-input, .qty-input, .number-input, .cart-name, .section-title-input, .note-input, .lock-no-input')) return;
        handleFieldChange(t);
    });

    container.addEventListener('focusout', e => {
        const t = e.target;
        if (!t.matches('.date-seg')) return;
        const { cartId, section, itemId } = t.dataset;
        const vals = getSegValues(cartId, section, itemId);
        if (vals.y && vals.m && !vals.d) {
            if (/^\d{2}$/.test(vals.y)) {
                const { yEl } = getSegEls(cartId, section, itemId);
                if (yEl) yEl.value = '20' + vals.y;
            }
            commitDateSeg(cartId, section, itemId, true);
        } else {
            commitDateSeg(cartId, section, itemId, true);
        }
    }, true);

    container.addEventListener('change', e => {
        const t = e.target;
        if (t.matches('.oos-checkbox')) {
            const { cartId, section, itemId } = t.dataset;
            const item = findItem(cartId, section, itemId);
            if (!item) return;
            const cart = carts.find(c => c.id === cartId);
            const oldVal = item.outOfStock;
            item.outOfStock = t.checked;
            saveToLocalStorage();
            if (oldVal !== item.outOfStock) {
                addLog('update', cart ? cart.name : '',
                    `物品「${item.name}」缺貨狀態：${oldVal ? '是' : '否'} → ${item.outOfStock ? '是' : '否'}`);
            }
            render();
            return;
        }
    });

    container.addEventListener('keydown', e => {
        const t = e.target;
        if (t.matches('.date-seg')) {
            const { cartId, section, itemId, field } = t.dataset;

            if (e.key === 'ArrowRight') {
                e.preventDefault();
                if (field === 'dateYear') {
                    const { mEl } = getSegEls(cartId, section, itemId);
                    if (mEl) { mEl.focus(); setTimeout(() => { if (typeof mEl.select === 'function') mEl.select(); }, 0); }
                } else if (field === 'dateMonth') {
                    const { dEl } = getSegEls(cartId, section, itemId);
                    if (dEl) { dEl.focus(); setTimeout(() => { if (typeof dEl.select === 'function') dEl.select(); }, 0); }
                }
                return;
            }
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                if (field === 'dateDay') {
                    const { mEl } = getSegEls(cartId, section, itemId);
                    if (mEl) { mEl.focus(); setTimeout(() => { if (typeof mEl.select === 'function') mEl.select(); }, 0); }
                } else if (field === 'dateMonth') {
                    const { yEl } = getSegEls(cartId, section, itemId);
                    if (yEl) { yEl.focus(); setTimeout(() => { if (typeof yEl.select === 'function') yEl.select(); }, 0); }
                }
                return;
            }
            if (e.key === 'Enter') {
                e.preventDefault();
                const vals = getSegValues(cartId, section, itemId);
                if (vals.y && vals.m && !vals.d) {
                    commitDateSeg(cartId, section, itemId, true);
                    focusNextDateYear(cartId, section, itemId);
                    return;
                }
                commitDateSeg(cartId, section, itemId, true);
                focusNextDateYear(cartId, section, itemId);
                return;
            }
            if (e.key === 'Backspace' && t.value === '') {
                if (field === 'dateMonth') {
                    e.preventDefault();
                    const { yEl } = getSegEls(cartId, section, itemId);
                    if (yEl) { yEl.focus(); setTimeout(() => { if (typeof yEl.select === 'function') yEl.select(); }, 0); }
                } else if (field === 'dateDay') {
                    e.preventDefault();
                    const { mEl } = getSegEls(cartId, section, itemId);
                    if (mEl) { mEl.focus(); setTimeout(() => { if (typeof mEl.select === 'function') mEl.select(); }, 0); }
                }
                return;
            }
            return;
        }
    });

    container.addEventListener('click', e => {
        const btn = e.target.closest('button');
        if (!btn || btn.disabled) return;

        if (btn.classList.contains('date-seg-clear')) {
            const { cartId, section, itemId } = btn.dataset;
            const item = findItem(cartId, section, itemId);
            const cart = carts.find(c => c.id === cartId);
            if (!item) return;
            item.expiry = '';
            saveToLocalStorage();
            addLog('update', cart ? cart.name : '', `清空物品「${item.name}」的有效日期`);
            render();
            return;
        }
        if (btn.classList.contains('delete-item')) {
            const { cartId, section, itemId } = btn.dataset;
            const cart = carts.find(c => c.id === cartId);
            if (!cart) return;
            const item = (cart.items[section] || []).find(i => i.id === itemId);
            if (!item) return;
            if (!confirm(`確定刪除物品「${item.name}」嗎？`)) return;
            cart.items[section] = (cart.items[section] || []).filter(i => i.id !== itemId);
            saveToLocalStorage();
            addLog('delete', cart.name, `刪除物品「${item.name}」`);
            render();
            return;
        }
        if (btn.classList.contains('add-item-to-section')) {
            const { cartId, section } = btn.dataset;
            const cart = carts.find(c => c.id === cartId);
            if (!cart) return;
            if (!cart.items[section]) cart.items[section] = [];
            const newItem = { id: genId('item'), name: '新物品', quantity: 1, expiry: '', outOfStock: false, note: '', lockNo: '' };
            cart.items[section].push(newItem);
            saveToLocalStorage();
            addLog('create', cart.name, `在區域「${(cart.sectionNames && cart.sectionNames[section]) || section}」新增物品「新物品」`);
            render();
            return;
        }
        if (btn.classList.contains('delete-section')) {
            const { cartId, section } = btn.dataset;
            const cart = carts.find(c => c.id === cartId);
            if (!cart) return;
            const secName = (cart.sectionNames && cart.sectionNames[section]) || section;
            const itemCount = (cart.items[section] || []).length;
            if (!confirm(`確定刪除區域「${secName}」嗎？此區域內有 ${itemCount} 項物品，將一併刪除。`)) return;
            delete cart.items[section];
            if (cart.sectionNames) delete cart.sectionNames[section];
            if (cart.sectionOrder) {
                cart.sectionOrder = cart.sectionOrder.filter(k => k !== section);
            }
            saveToLocalStorage();
            addLog('delete', cart.name, `刪除區域「${secName}」（含 ${itemCount} 項物品）`);
            render();
            return;
        }
        if (btn.classList.contains('add-section-btn')) {
            const cartId = btn.dataset.cartId;
            const cart = carts.find(c => c.id === cartId);
            if (!cart) return;
            const name = prompt('請輸入新區域名稱：');
            if (name === null) return;
            const trimmed = name.trim();
            if (!trimmed) { alert('區域名稱不能為空'); return; }
            const key = 'custom_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            cart.items[key] = [];
            if (!cart.sectionNames) cart.sectionNames = {};
            cart.sectionNames[key] = trimmed;
            if (!cart.sectionOrder) cart.sectionOrder = Object.keys(cart.items);
            if (!cart.sectionOrder.includes(key)) cart.sectionOrder.push(key);
            saveToLocalStorage();
            addLog('create', cart.name, `新增區域「${trimmed}」`);
            render();
            return;
        }
        if (btn.classList.contains('move-section-up')) {
            const { cartId, section } = btn.dataset;
            const cart = carts.find(c => c.id === cartId);
            if (!cart || !cart.sectionOrder) return;
            const idx = cart.sectionOrder.indexOf(section);
            if (idx <= 0) return;
            [cart.sectionOrder[idx - 1], cart.sectionOrder[idx]] = [cart.sectionOrder[idx], cart.sectionOrder[idx - 1]];
            saveToLocalStorage();
            render();
            return;
        }
        if (btn.classList.contains('move-section-down')) {
            const { cartId, section } = btn.dataset;
            const cart = carts.find(c => c.id === cartId);
            if (!cart || !cart.sectionOrder) return;
            const idx = cart.sectionOrder.indexOf(section);
            if (idx < 0 || idx >= cart.sectionOrder.length - 1) return;
            [cart.sectionOrder[idx + 1], cart.sectionOrder[idx]] = [cart.sectionOrder[idx], cart.sectionOrder[idx + 1]];
            saveToLocalStorage();
            render();
            return;
        }
        if (btn.classList.contains('delete-cart')) {
            const cartId = btn.dataset.cartId;
            const cart = carts.find(c => c.id === cartId);
            if (!cart) return;
            if (!requestDeletePassword()) return;
            addLog('delete', cart.name, `刪除整台急救車「${cart.name}」`);
            carts = carts.filter(c => c.id !== cartId);
            if (carts.length === 0) activeTab = 'overview';
            else { activeTab = 'cart:0'; currentCartIndex = 0; }
            saveToLocalStorage();
            render();
            return;
        }
    });

    document.getElementById('addCartBtn').addEventListener('click', () => {
        const newCart = createFullCart(`急救車 - ${String(carts.length + 1).padStart(2,'0')}`);
        carts.push(newCart);
        activeTab = 'cart:' + (carts.length - 1);
        currentCartIndex = carts.length - 1;
        saveToLocalStorage();
        addLog('create', newCart.name, `新增急救車「${newCart.name}」`);
        render();
    });

    document.getElementById('adminBtn').addEventListener('click', () => {
        if (!requestAdminPassword()) return;
        activeTab = 'admin';
        render();
    });

    document.getElementById('logoutBtn').addEventListener('click', logout);

    document.getElementById('exportWordBtn').addEventListener('click', () => {
        if (activeTab === 'overview') {
            exportMonth15ToWord();
        } else if (activeTab === 'admin') {
            alert('管理功能頁面無法匯出 Word。');
        } else {
            if (!templateArrayBuffer) {
                document.getElementById('templateFileInput').click();
            } else {
                exportCartToDocx();
            }
        }
    });

    document.getElementById('templateFileInput').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            templateArrayBuffer = ev.target.result;
            templateFileName = file.name;
            updateTemplateHint();
            exportCartToDocx();
        };
        reader.readAsArrayBuffer(file);
        e.target.value = '';
    });

    document.getElementById('importJsonInput').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        importFromJson(file);
        e.target.value = '';
    });

    document.getElementById('fontSizeDown').addEventListener('click', () => {
        changeFontSize(-1);
    });
    document.getElementById('fontSizeUp').addEventListener('click', () => {
        changeFontSize(1);
    });
}

function updateTemplateHint() {
    const hint = document.getElementById('templateHint');
    if (templateArrayBuffer) {
        hint.textContent = `模板：${templateFileName} ✅`;
        hint.classList.add('ok');
    } else {
        hint.textContent = '模板：未選擇';
        hint.classList.remove('ok');
    }
}

async function autoLoadTemplate() {
    try {
        const res = await fetch('./template.docx');
        if (!res.ok) throw new Error('找不到 template.docx');
        templateArrayBuffer = await res.arrayBuffer();
        templateFileName = 'template.docx';
        updateTemplateHint();
        console.log("✅ 模板自動載入成功");
    } catch (e) {
        console.warn("⚠️ 自動載入模板失敗，需手動選擇:", e);
    }
}

function handleFieldChange(target) {
    const { cartId, section, itemId, field, sectionKey } = target.dataset;

    if (field === 'name' && !section) {
        const cart = carts.find(c => c.id === cartId);
        if (cart) {
            const oldName = cart.name;
            cart.name = target.value;
            saveToLocalStorage();
            if (oldName !== cart.name) {
                addLog('update', cart.name, `修改車名：「${oldName}」→「${cart.name}」`);
            }
            renderTabs();
        }
        return;
    }
    if (field === 'sectionName' && sectionKey) {
        const cart = carts.find(c => c.id === cartId);
        if (!cart) return;
        if (!cart.sectionNames) cart.sectionNames = {};
        const oldName = cart.sectionNames[sectionKey] || sectionKey;
        cart.sectionNames[sectionKey] = target.value;
        saveToLocalStorage();
        if (oldName !== target.value) {
            addLog('update', cart.name, `修改區域名稱：「${oldName}」→「${target.value}」`);
        }
        return;
    }
    if (!itemId) return;
    const item = findItem(cartId, section, itemId);
    if (!item) return;
    const cart = carts.find(c => c.id === cartId);

    let value = target.value;
    if (field === 'quantity') {
        value = parseInt(value, 10);
        if (isNaN(value) || value < 0) value = 0;
    }

    const oldValue = item[field];
    if (oldValue === value) return;

    item[field] = value;
    saveToLocalStorage();

    const fieldName = {
        name: '物品名稱',
        quantity: '數量',
        note: '備註',
        lockNo: '鎖匙編號'
    }[field] || field;

    addLog('update', cart ? cart.name : '',
        `${fieldName}「${field === 'name' ? oldValue : item.name}」：${oldValue || '(空)'} → ${value || '(空)'}`);
}

function findItem(cartId, section, itemId) {
    const cart = carts.find(c => c.id === cartId);
    if (!cart) return null;
    return (cart.items[section] || []).find(i => i.id === itemId);
}

function updateRowDisplay(cartId, section, itemId) {
    const item = findItem(cartId, section, itemId);
    if (!item) return;
    const row = document.querySelector(`tr[data-cart-id="${cartId}"][data-section="${section}"][data-item-id="${itemId}"]`);
    if (!row) return;

    const rowClass = getRowHighlightClass(item);
    row.classList.remove('row-warning', 'row-danger', 'row-outofstock');
    if (rowClass) row.classList.add(rowClass);

    const tds = row.querySelectorAll('td');
    if (tds.length >= 6) {
        const statusTd = tds[5];
        if (item.outOfStock) {
            statusTd.innerText = '缺貨';
            statusTd.style.color = '#b33a3a';
        } else if (isNonExpiring(item.expiry)) {
            statusTd.innerHTML = '<span class="no-expiry-badge">不會過期</span>';
            statusTd.style.color = '';
        } else {
            const d = daysUntil(item.expiry);
            let txt = d < 0 ? `已過期 ${Math.abs(d)} 天` : `${d} 天`;
            statusTd.innerText = txt;
            statusTd.style.color = d < 30 ? '#b33a3a' : (d < 90 ? '#b68b00' : '#2a4d62');
        }
    }

    const segGroup = row.querySelector('.date-seg-group');
    if (segGroup) {
        segGroup.classList.remove('warning', 'danger');
        const sc = getDateSegHighlight(item.expiry);
        if (sc) segGroup.classList.add(sc);
    }
}

function findItemExpiry(cart, sectionKey, matchText) {
    const items = cart.items[sectionKey] || [];
    const found = items.find(it => it.name.includes(matchText));
    return found ? found : null;
}

/* ============================================================
   Word 匯出（單台車） - 已依需求調整
   ============================================================ */
function exportCartToDocx() {
    const cart = carts[currentCartIndex];
    if (!cart) { alert('找不到急救車資料'); return; }
    if (!templateArrayBuffer) { alert('請先選擇模板檔案 急救車_template.docx'); return; }

    const data = {};
    data.location = cart.name;

    /* 日期改成每月 15 號（本月 15 號） */
    const today = new Date();
    const y = today.getFullYear();
    const m = today.getMonth() + 1;
    data.today = `${y}-${String(m).padStart(2,'0')}-15`;

    /* 取得急救藥物盒鎖匙物品 */
    function getLockItem(cart) {
        const items = cart.items.level1 || [];
        return items.find(it =>
            it.name.includes('急救藥物盒鎖匙') || it.name.includes('Lock No')
        ) || null;
    }

    /* level1_lock_no = 備註欄的藥盒編號 */
    function extractLockNo(cart) {
        const lockItem = getLockItem(cart);
        if (!lockItem) return '';
        if (lockItem.note && lockItem.note.trim() !== '') {
            return lockItem.note.trim();
        }
        return '';
    }

    /* level1_lock = 有效日期（若無效期則為 N/A） */
    function extractLockExpiry(cart) {
        const lockItem = getLockItem(cart);
        if (!lockItem) return 'N/A';
        if (lockItem.outOfStock) return '缺貨';
        if (lockItem.expiry && lockItem.expiry.trim() !== '') {
            return lockItem.expiry.trim();
        }
        return 'N/A';
    }

    data.level1_lock_no = extractLockNo(cart);

    WORD_TEMPLATE.page1.concat(WORD_TEMPLATE.page2).forEach(block => {
        block.items.forEach(row => {
            const item = findItemExpiry(cart, row.section, row.match);
            let value = 'N/A';
            if (item) {
                if (item.outOfStock) value = '缺貨';
                else if (item.expiry && item.expiry.trim() !== '') value = item.expiry;
                else value = 'N/A';
            }

            /* 急救藥物盒鎖匙：有效日期欄位 → level1_lock；備註欄位 → level1_lock_no */
            if (row.placeholder === 'level1_lock') {
                data['level1_lock'] = extractLockExpiry(cart);
                data['level1_lock_no'] = extractLockNo(cart);
            } else {
                data[row.placeholder] = value;
            }
        });
    });

    try {
        const zip = new PizZip(templateArrayBuffer);
        const doc = new window.docxtemplater(zip, {
            paragraphLoop: true,
            linebreaks: true,
            delimiters: { start: '{{', end: '}}' },
            nullGetter: () => 'N/A'
        });
        doc.render(data);
        const out = doc.getZip().generate({
            type: 'blob',
            mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
        });
        const fileName = `${cart.name}_${new Date().toISOString().slice(0,10)}.docx`;
        safeSaveAs(out, fileName);
        addLog('update', cart.name, `匯出 Word 檔「${fileName}」`);
    } catch (err) {
        console.error(err);
        alert('匯出失敗：' + err.message);
    }
}

/* ============================================================
   初始化
   ============================================================ */
window.render = render;
window.carts = carts;
