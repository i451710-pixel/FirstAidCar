<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>急救車物品管理系統</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, 'Microsoft JhengHei', 'Helvetica Neue', sans-serif; }
        :root { font-size: 17px; }
        html[data-fontsize="small"] { font-size: 15px; }
        html[data-fontsize="medium"] { font-size: 17px; }
        html[data-fontsize="large"] { font-size: 19px; }
        html[data-fontsize="xlarge"] { font-size: 21px; }
        html[data-fontsize="xxlarge"] { font-size: 24px; }
        html[data-fontsize="xxxlarge"] { font-size: 27px; }
        body { background: #f4f7fc; margin: 0; padding: 24px; color: #1e2b3c; font-size: 1rem; }
        .app { max-width: 1500px; margin: 0 auto; }

        h1 { font-size: 2.1rem; display: flex; align-items: center; gap: 12px; margin-top: 0; margin-bottom: 18px; color: #0b3b5c; border-left: 7px solid #1e7e83; padding-left: 20px; }

        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 22px; background: white; padding: 16px 26px; border-radius: 18px; box-shadow: 0 6px 14px rgba(0,20,30,0.08); }
        .btn { background: #fff; border: 1px solid #b8cdd9; padding: 11px 22px; border-radius: 40px; font-weight: 600; font-size: 1rem; color: #1e4a5f; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: 0.15s; }
        .btn:hover { background: #e5f0f5; border-color: #7fa9bc; }
        .btn-primary { background: #1e7e83; border-color: #1e7e83; color: #fff; }
        .btn-primary:hover { background: #146c70; }
        .btn-warning { background: #fff8e1; border-color: #e6c300; color: #8a6d00; }
        .btn-warning:hover { background: #fff2c2; }
        .btn-danger { background: #fff0f0; border-color: #d99b9b; color: #b33a3a; }
        .btn-danger:hover { background: #ffe0e0; }
        .btn-export { background: #2b5797; border-color: #2b5797; color: #fff; }
        .btn-export:hover { background: #1e3f73; }
        .btn-admin { background: #6b4fa8; border-color: #6b4fa8; color: #fff; }
        .btn-admin:hover { background: #573e8c; }
        .btn-purple { background: #6b4fa8; border-color: #6b4fa8; color: #fff; }
        .btn-purple:hover { background: #573e8c; }
        .btn-purple-outline { background: #fff; border-color: #6b4fa8; color: #6b4fa8; }
        .btn-purple-outline:hover { background: #ede4ff; }
        .btn-sm { padding: 7px 15px; font-size: 0.92rem; }
        .btn-move { background: #e8f4f9; border-color: #1e7e83; color: #1e4a5f; padding: 5px 10px; font-size: 0.85rem; line-height: 1; }
        .btn-move:hover { background: #d0e8f0; }
        .btn-move:disabled { opacity: 0.35; cursor: not-allowed; }
        .fontsize-group { display: inline-flex; gap: 4px; align-items: center; background: #f5f8fa; border: 1px solid #cbdae3; border-radius: 40px; padding: 4px 8px; }
        .fontsize-group button { background: #fff; border: 1px solid #cbdae3; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-weight: 700; font-size: 0.9rem; color: #1e4a5f; transition: 0.15s; display: inline-flex; align-items: center; justify-content: center; }
        .fontsize-group button:hover { background: #e5f0f5; border-color: #1e7e83; }
        .fontsize-group button.active { background: #1e7e83; border-color: #1e7e83; color: #fff; }
        .fontsize-label { font-size: 0.8rem; color: #6b8a9c; margin-left: 4px; }

        .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; background: white; padding: 12px 18px; border-radius: 18px; box-shadow: 0 4px 10px rgba(0,20,30,0.06); align-items: center; }
        .tab-btn { padding: 10px 20px; border-radius: 40px; border: 1px solid #c2dae6; background: #fff; color: #1e4a5f; font-weight: 600; font-size: 0.98rem; cursor: pointer; transition: 0.1s; white-space: nowrap; }
        .tab-btn:hover { background: #e5f0f5; }
        .tab-btn.active { background: #1e7e83; border-color: #1e7e83; color: #fff; }
        .tab-btn.tab-alert { background: #fff8e1; border-color: #e6c300; color: #8a6d00; }
        .tab-btn.tab-alert.active { background: #d4a800; border-color: #d4a800; color: #fff; }
        .tab-btn.draggable-cart { cursor: grab; position: relative; user-select: none; }
        .tab-btn.draggable-cart:active { cursor: grabbing; }
        .tab-btn.draggable-cart.dragging { opacity: 0.35; }
        .tab-btn.draggable-cart.drag-over { box-shadow: 0 0 0 3px #1e7e83, 0 0 12px rgba(30,126,131,0.4); transform: scale(1.05); }
        .tab-btn.draggable-cart::after { content: '⋮⋮'; font-size: 0.7rem; color: #8aa9bb; margin-left: 6px; letter-spacing: -2px; }
        .tab-btn.tab-btn.active.draggable-cart::after { color: rgba(255,255,255,0.7); }

        .cart-card { background: #fff; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,20,30,0.08); overflow: hidden; border: 1px solid #dee9f0; margin-bottom: 32px; }
        .cart-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; background: #eef6fa; padding: 18px 28px; border-bottom: 1px solid #cfe0ea; }
        .cart-title { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .cart-name { font-size: 1.6rem; font-weight: 700; color: #0b3b5c; background: transparent; border: 1px solid transparent; padding: 6px 10px; border-radius: 8px; min-width: 260px; }
        .cart-name:focus { background: #fff; border-color: #1e7e83; outline: none; }
        .cart-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .cart-meta { display: flex; gap: 10px; align-items: center; font-size: 0.95rem; color: #3b657a; flex-wrap: wrap; }
        .cart-meta span { background: #fff; padding: 6px 14px; border-radius: 30px; border: 1px solid #c2dae6; }
        .cart-meta .badge-warning { background: #fff8d6; color: #8a6d00; border-color: #e6c300; font-weight: 700; }
        .cart-meta .badge-danger { background: #ffe1e1; color: #a00; border-color: #d44; font-weight: 700; }
        .cart-meta .badge-danger.pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(211,68,68,0.4); }
            50% { box-shadow: 0 0 0 6px rgba(211,68,68,0); }
        }

        .section-header { background: #dceef5; padding: 12px 22px; font-weight: 700; color: #0b3b5c; font-size: 1.15rem; border-top: 1px solid #cfe0ea; border-bottom: 1px solid #cfe0ea; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .section-header:first-of-type { border-top: none; }
        .section-header .section-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .section-title-input { background: transparent; border: 1px solid transparent; font-weight: 700; color: #0b3b5c; font-size: 1.15rem; padding: 4px 8px; border-radius: 6px; min-width: 260px; flex: 1; }
        .section-title-input:focus { background: #fff; border-color: #1e7e83; outline: none; }

        .add-section-bar { padding: 16px 22px; text-align: center; background: #f7fbfd; border-top: 1px dashed #cfe0ea; }

        .table-wrapper { overflow-x: auto; padding: 0 14px 14px; }
        table { width: 100%; border-collapse: collapse; font-size: 1rem; min-width: 1200px; }
        th { text-align: left; padding: 12px 12px 8px; font-weight: 600; color: #2a4d62; border-bottom: 2px solid #c9dde8; white-space: nowrap; font-size: 0.95rem; }
        td { padding: 8px 12px; border-bottom: 1px solid #e5eef3; vertical-align: middle; }

        input.item-name-input, input.number-input, input.note-input, input.lock-no-input {
            width: 100%; padding: 9px 12px; border: 1px solid #cbdae3; border-radius: 10px; font-size: 1rem; background: #fff; transition: 0.1s;
        }
        input.item-name-input:focus, input.number-input:focus, input.note-input:focus, input.lock-no-input:focus { border-color: #1e7e83; outline: none; box-shadow: 0 0 0 3px rgba(30,126,131,0.12); }
        input.note-input { font-size: 0.95rem; }
        input.lock-no-input { font-size: 0.95rem; }
        .number-input, .qty-input { width: 80px; text-align: center; }

        .date-seg-group {
            display: inline-flex; align-items: center; gap: 3px;
            background: #fff; border: 1px solid #cbdae3; border-radius: 10px;
            padding: 4px 8px; transition: 0.1s;
        }
        .date-seg-group:focus-within {
            border-color: #1e7e83;
            box-shadow: 0 0 0 3px rgba(30,126,131,0.12);
        }
        .date-seg {
            border: none; outline: none; background: transparent;
            font-size: 1rem; text-align: center; font-family: inherit;
            color: #1e2b3c; padding: 5px 3px;
            -moz-appearance: textfield;
        }
        .date-seg::-webkit-outer-spin-button,
        .date-seg::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .date-seg.year { width: 58px; }
        .date-seg.month { width: 38px; }
        .date-seg.day { width: 38px; }
        .date-seg-sep { color: #8aa9bb; font-weight: 600; user-select: none; }
        .date-seg-clear {
            background: none; border: none; cursor: pointer;
            color: #8aa9bb; font-size: 0.85rem; padding: 3px 6px;
            border-radius: 6px; line-height: 1; margin-left: 2px;
        }
        .date-seg-clear:hover { background: #ffe1e1; color: #b33a3a; }

        .date-seg-group.warning { background-color: #fff8d6 !important; border-color: #e6c300 !important; }
        .date-seg-group.warning .date-seg { font-weight: 600; }
        .date-seg-group.danger { background-color: #ffe1e1 !important; border-color: #d44 !important; }
        .date-seg-group.danger .date-seg { color: #a00 !important; font-weight: 700; }

        .row-warning { background-color: #fffbe6; }
        .row-danger { background-color: #fff0f0; }
        .row-expired { background-color: #ffe0e0; }
        .row-outofstock { background-color: #ffe1e1 !important; }

        .action-buttons { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
        .icon-btn { background: none; border: none; font-size: 1.25rem; cursor: pointer; padding: 6px 8px; border-radius: 30px; color: #5e7e8f; transition: 0.1s; line-height: 1; }
        .icon-btn:hover { background: #e1eef5; color: #0b3b5c; }
        .icon-btn.delete:hover { background: #ffe1e1; color: #b33a3a; }
        .no-expiry-badge { display: inline-block; background: #e8f0f5; color: #4a6f82; font-size: 0.82rem; padding: 4px 12px; border-radius: 30px; font-weight: 500; }
        .badge { background: #1e7e83; color: #fff; padding: 4px 12px; border-radius: 30px; font-size: 0.85rem; font-weight: 600; }

        .oos-label { display: inline-flex; align-items: center; gap: 5px; font-size: 0.9rem; color: #3b657a; font-weight: 500; cursor: pointer; user-select: none; white-space: nowrap; }
        .oos-label input[type="checkbox"] { width: 18px; height: 18px; accent-color: #b33a3a; cursor: pointer; }
        .oos-label.checked { color: #fff; background: #b33a3a; padding: 4px 10px; border-radius: 30px; font-weight: 700; }
        .oos-label.checked input[type="checkbox"] { accent-color: #fff; }

        .overview-card { background: #fff; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,20,30,0.08); padding: 26px; border: 1px solid #dee9f0; }
        .overview-title { font-size: 1.5rem; font-weight: 700; color: #0b3b5c; margin-bottom: 8px; }
        .overview-sub { color: #4a6f82; font-size: 1rem; margin-bottom: 20px; }
        .overview-summary { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 22px; }
        .summary-box { padding: 16px 28px; border-radius: 16px; font-weight: 600; min-width: 150px; font-size: 1rem; }
        .summary-box .num { font-size: 2rem; font-weight: 800; display: block; }
        .summary-box.danger { background: #ffe1e1; color: #a00; }
        .summary-box.warning { background: #fff8d6; color: #8a6d00; }
        .summary-box.total { background: #e3f0f5; color: #1e4a5f; }

        .month15-card { background: #fff; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,20,30,0.08); padding: 26px; border: 1px solid #dee9f0; margin-bottom: 30px; border-left: 6px solid #6b4fa8; }
        .month15-title { font-size: 1.5rem; font-weight: 700; color: #6b4fa8; margin-bottom: 8px; }
        .month15-sub { color: #4a6f82; font-size: 1rem; margin-bottom: 20px; }
        .month15-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; padding: 14px 18px; background: #f5f0ff; border-radius: 14px; border: 1px solid #d8c9f0; }
        .month15-controls label { font-weight: 600; color: #6b4fa8; }
        .month15-controls select {
            padding: 10px 14px; border: 1px solid #c9b8e8; border-radius: 10px; font-size: 1rem;
            background: #fff; color: #1e2b3c; cursor: pointer; font-family: inherit;
        }
        .month15-controls select:focus { border-color: #6b4fa8; outline: none; box-shadow: 0 0 0 3px rgba(107,79,168,0.15); }
        .month15-countdown { font-size: 0.95rem; color: #6b4fa8; font-weight: 600; margin-left: auto; }
        .month15-empty { text-align: center; padding: 40px 20px; color: #8aa9bb; font-size: 1.05rem; }
        .month15-summary { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
        .month15-summary .summary-box.purple { background: #ede4ff; color: #4a2d80; }
        .month15-location-header { background: #f0e8ff; padding: 10px 18px; font-weight: 700; color: #4a2d80; border-radius: 10px; margin: 16px 0 8px; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #6b4fa8; }
        .month15-location-header .count-badge { background: #6b4fa8; color: #fff; padding: 3px 12px; border-radius: 30px; font-size: 0.8rem; }
        .status-warning { background: #fff8d6; font-weight: 700; color: #8a6d00; }
        .status-danger { background: #ffe1e1; font-weight: 700; color: #a00; }
        .note-cell { font-size: 0.9rem; color: #5e7e8f; max-width: 180px; }

        .empty-state { text-align: center; padding: 60px 20px; color: #8aa9bb; font-size: 1.1rem; }

        .footer-note { margin-top: 32px; padding: 18px 28px; background: #e3f0f5; border-radius: 16px; font-size: 0.95rem; color: #2f5569; display: flex; flex-wrap: wrap; gap: 22px; justify-content: space-between; }

        .page-content { display: none; }
        .page-content.active { display: block; }

        .location-group-header { background: #e8f4f9; padding: 12px 20px; font-weight: 700; color: #0b3b5c; border-radius: 12px; margin: 18px 0 10px; font-size: 1.05rem; display: flex; justify-content: space-between; align-items: center; }
        .location-group-header .count-badge { background: #1e7e83; color: #fff; padding: 4px 14px; border-radius: 30px; font-size: 0.85rem; }

        .template-hint { font-size: 0.9rem; color: #6b8a9c; }
        .template-hint.ok { color: #1e7e83; font-weight: 600; }

        #loginOverlay {
            position: fixed; inset: 0; background: linear-gradient(135deg, #1e7e83 0%, #0b3b5c 100%);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .login-box {
            background: #fff; border-radius: 24px; padding: 40px 48px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center; max-width: 440px; width: 90%;
        }
        .login-box h2 { margin: 0 0 8px; color: #0b3b5c; font-size: 1.8rem; }
        .login-box p { color: #6b8a9c; margin: 0 0 24px; font-size: 1rem; }
        .login-box input {
            width: 100%; padding: 14px 18px; border: 1px solid #cbdae3; border-radius: 12px;
            font-size: 1.1rem; text-align: center; margin-bottom: 18px;
        }
        .login-box input:focus { border-color: #1e7e83; outline: none; box-shadow: 0 0 0 3px rgba(30,126,131,0.15); }
        .login-box button {
            width: 100%; padding: 14px; background: #1e7e83; color: #fff; border: none; border-radius: 12px;
            font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.15s;
        }
        .login-box button:hover { background: #146c70; }
        .login-error { color: #b33a3a; font-size: 0.9rem; margin-top: 10px; min-height: 20px; }

        .user-bar { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; color: #1e4a5f; }
        .user-bar .user-name { background: #e3f0f5; padding: 6px 14px; border-radius: 30px; font-weight: 600; }
        .user-bar .user-name.full-access { background: #e3f5e8; color: #1e7e3c; border: 1px solid #7dcf95; }
        .user-bar .logout-btn { background: #fff; border: 1px solid #b8cdd9; padding: 6px 14px; border-radius: 30px; font-size: 0.85rem; cursor: pointer; color: #1e4a5f; font-weight: 600; }
        .user-bar .logout-btn:hover { background: #ffe1e1; border-color: #d99b9b; color: #b33a3a; }

        .admin-card { background: #fff; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,20,30,0.08); padding: 26px; border: 1px solid #dee9f0; }
        .admin-title { font-size: 1.5rem; font-weight: 700; color: #0b3b5c; margin-bottom: 8px; }
        .admin-sub { color: #4a6f82; font-size: 1rem; margin-bottom: 20px; }
        .admin-section { margin-bottom: 36px; padding-bottom: 28px; border-bottom: 1px dashed #cfe0ea; }
        .admin-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .admin-section-title { font-size: 1.2rem; font-weight: 700; color: #0b3b5c; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .admin-form { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px; }
        .admin-form input[type="text"], .admin-form input[type="number"], .admin-form input[type="date"] {
            padding: 10px 14px; border: 1px solid #cbdae3; border-radius: 10px; font-size: 1rem;
        }
        .admin-form input:focus { border-color: #1e7e83; outline: none; box-shadow: 0 0 0 3px rgba(30,126,131,0.12); }
        .admin-form label { font-weight: 600; color: #2a4d62; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        .admin-table th { background: #eef6fa; padding: 10px 12px; text-align: left; border-bottom: 2px solid #c9dde8; font-weight: 600; color: #2a4d62; white-space: nowrap; }
        .admin-table td { padding: 9px 12px; border-bottom: 1px solid #e5eef3; vertical-align: middle; }
        .admin-table tr:hover td { background: #f7fbfd; }
        .log-action { display: inline-block; padding: 3px 10px; border-radius: 30px; font-size: 0.82rem; font-weight: 600; white-space: nowrap; }
        .log-action.create { background: #e3f5e8; color: #1e7e3c; }
        .log-action.update { background: #fff8d6; color: #8a6d00; }
        .log-action.delete { background: #ffe1e1; color: #a00; }
        .log-action.login { background: #e3f0f5; color: #1e4a5f; }
        .log-empty { text-align: center; padding: 50px 20px; color: #8aa9bb; font-size: 1.05rem; }
        .admin-checkbox { width: 18px; height: 18px; accent-color: #1e7e83; cursor: pointer; }
        .admin-hint { font-size: 0.9rem; color: #6b8a9c; margin-bottom: 10px; }
        .admin-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
        .cart-id-cell { font-family: monospace; font-size: 0.85rem; color: #6b8a9c; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2>🚑 急救車物品管理系統</h2>
        <p>請輸入您的工號以進入系統</p>
        <input type="text" id="loginInput" placeholder="請輸入工號" autocomplete="off" maxlength="7">
        <button id="loginBtn">進入系統</button>
        <div class="login-error" id="loginError"></div>
    </div>
</div>

<div class="app" id="appContainer" style="display:none;">
    <h1>
        <span>🚑 急救車物品管理系統</span>
        <span class="badge" id="cartCount">0 台</span>
        <span class="user-bar" style="margin-left:auto;">
            <span class="user-name" id="currentUser">—</span>
            <button class="logout-btn" id="logoutBtn">登出</button>
        </span>
    </h1>

    <div class="toolbar">
        <button class="btn btn-primary" id="addCartBtn">＋ 新增急救車</button>
        <button class="btn btn-export" id="exportWordBtn">📄 匯出</button>
        <span class="template-hint" id="templateHint">模板：未選擇</span>
        <button class="btn btn-admin" id="adminBtn">⚙️ 管理功能 🔒</button>
        <div class="fontsize-group" title="調整字體大小">
            <button id="fontSizeDown" title="縮小字體">A－</button>
            <button id="fontSizeUp" title="放大字體">A＋</button>
            <span class="fontsize-label" id="fontSizeLabel">中</span>
        </div>
        <span style="flex:1; text-align:right; font-size:0.9rem; color:#476f84;">
            ⚠️ &lt; 90天 黃色高亮 | &lt; 30天或缺貨 紅色高亮 | 留空 = 不會過期 | ⏎ Enter 跳下一項
        </span>
    </div>

    <input type="file" id="templateFileInput" accept=".docx" style="display:none">
    <input type="file" id="importJsonInput" accept=".json,application/json" style="display:none">

    <div class="tabs" id="tabsContainer"></div>

    <div id="pageContainer"></div>
       </div>

/* 備用 saveAs */
function safeSaveAs(blob, filename) {
    if (typeof window.saveAs === 'function') {
        window.saveAs(blob, filename);
        return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const FONT_KEY = 'firstAidFontSize_v2';
const FONT_SIZES = ['small', 'medium', 'large', 'xlarge', 'xxlarge', 'xxxlarge'];
const FONT_LABELS = { small: '小', medium: '中', large: '大', xlarge: '特大', xxlarge: '巨大', xxxlarge: '超大' };

function loadFontSize() {
    try {
        const v = localStorage.getItem(FONT_KEY);
        if (FONT_SIZES.includes(v)) return v;
    } catch (e) {}
    return 'medium';
}
function applyFontSize(size) {
    if (!FONT_SIZES.includes(size)) size = 'medium';
    document.documentElement.setAttribute('data-fontsize', size);
    try { localStorage.setItem(FONT_KEY, size); } catch (e) {}
    const label = document.getElementById('fontSizeLabel');
    if (label) label.textContent = FONT_LABELS[size];
}
function changeFontSize(direction) {
    let cur = loadFontSize();
    let idx = FONT_SIZES.indexOf(cur);
    if (direction > 0) idx = Math.min(FONT_SIZES.length - 1, idx + 1);
    else idx = Math.max(0, idx - 1);
    applyFontSize(FONT_SIZES[idx]);
}

    })();

})();

    try {
        if (!window.firebaseAPI) {

        }
        const { doc, getDoc, db, authReady } = window.firebaseAPI;
        
        // 👇 關鍵：先等待匿名登入完成，再去讀取資料
        await authReady; 

        const docRef = doc(db, "carts", "main");
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {

            return data.carts || [];

function isLogExpired(log) {
    if (!log || !log.time) return true;
    const t = new Date(log.time).getTime();
    if (isNaN(t)) return true;
    const cutoff = Date.now() - LOG_MAX_DAYS * 24 * 60 * 60 * 1000;
    return t < cutoff;
}
function loadLogs() {
    try {
        const raw = localStorage.getItem(LOG_KEY);
        if (!raw) return [];
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return [];
        const valid = arr.filter(log => !isLogExpired(log));
        if (valid.length !== arr.length) {
            try { localStorage.setItem(LOG_KEY, JSON.stringify(valid)); } catch (e) {}
        }
        return valid;
    } catch (e) { return []; }
}
function saveLogs(logs) {
    try {
        const valid = logs.filter(log => !isLogExpired(log));
        localStorage.setItem(LOG_KEY, JSON.stringify(valid));
    } catch (e) {}
}
function addLog(action, target, detail) {
    const logs = loadLogs();
    logs.push({
        time: new Date().toISOString(),
        user: currentUser || '未知',
        action: action,
        target: target,
        detail: detail
    });
    if (logs.length > 2000) logs.splice(0, logs.length - 2000);
    saveLogs(logs);
}

/* ============================================================
   工具函式
   ============================================================ */
function genId(prefix) { return prefix + '-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6); }

function daysUntil(dateStr) {
    if (!dateStr || dateStr.trim() === '') return Infinity;
    const today = new Date(); today.setHours(0,0,0,0);
    const target = new Date(dateStr);
    if (isNaN(target)) return Infinity;
    target.setHours(0,0,0,0);
    return Math.ceil((target - today) / 86400000);
}

function isNonExpiring(dateStr) {
    return !dateStr || dateStr.trim() === '' || daysUntil(dateStr) === Infinity;
}

function getDateSegHighlight(dateStr) {
    if (isNonExpiring(dateStr)) return '';
    const days = daysUntil(dateStr);
    if (days < 30) return 'danger';
    if (days < 90) return 'warning';
    return '';
}

function getRowHighlightClass(item) {
    if (item.outOfStock) return 'row-outofstock';
    const dateStr = item.expiry;
    if (isNonExpiring(dateStr)) return '';
    const days = daysUntil(dateStr);
    if (days < 30) return 'row-danger';
    if (days < 90) return 'row-warning';
    return '';
}

function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function formatTime(iso) {
    try {
        const d = new Date(iso);
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    } catch (e) { return iso; }
}

function countCartStats(cart) {
    let warningCount = 0, dangerCount = 0, oosCount = 0;
    Object.keys(cart.items).forEach(k => {
        (cart.items[k] || []).forEach(item => {
            if (item.outOfStock) { oosCount++; return; }
            if (isNonExpiring(item.expiry)) return;
            const d = daysUntil(item.expiry);
            if (d < 30) dangerCount++;
            else if (d < 90) warningCount++;
        });
    });
    return { warningCount, dangerCount, oosCount };
}

/* ============================================================
   日期工具
   ============================================================ */
function getLastDayOfMonth(year, month) {
    return new Date(year, month, 0).getDate();
}
function parseDateStr(s) {
    if (!s || typeof s !== 'string') return { y: '', m: '', d: '' };
    const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return { y: '', m: '', d: '' };
    return { y: m[1], m: String(parseInt(m[2], 10)), d: String(parseInt(m[3], 10)) };
}
function formatDateStr(y, m, d) {
    if (!y || !m || !d) return '';
    const pad = n => String(n).padStart(2, '0');
    return `${y}-${pad(m)}-${pad(d)}`;
}

/* ============================================================
   每月 15 日工具
   ============================================================ */
function getNext15thDate() {
    const today = new Date(); today.setHours(0,0,0,0);
    const y = today.getFullYear();
    const m = today.getMonth();
    const d = today.getDate();
    if (d <= 15) {
        return { y, m: m + 1, d: 15 };
    } else {
        const next = new Date(y, m + 1, 1);
        return { y: next.getFullYear(), m: next.getMonth() + 1, d: 15 };
    }
}

function generateMonth15Options(count = 12) {
    const base = getNext15thDate();
    const options = [];
    for (let i = 0; i < count; i++) {
        const dt = new Date(base.y, base.m - 1 + i, 15);
        options.push({
            y: dt.getFullYear(),
            m: dt.getMonth() + 1,
            d: 15
        });
    }
    return options;
}

function formatMonth15Label(opt) {
    const m = String(opt.m).padStart(2, '0');
    return `${opt.y}/${m}/15`;
}

function formatYMD(opt) {
    const m = String(opt.m).padStart(2, '0');
    const d = String(opt.d).padStart(2, '0');
    return `${opt.y}-${m}-${d}`;
}

function collectItemsWithin90Days(targetDateStr) {
    const rows = [];
    carts.forEach(cart => {
        Object.keys(cart.items).forEach(k => {
            const secName = (cart.sectionNames && cart.sectionNames[k]) || k;
            (cart.items[k] || []).forEach(item => {
                if (item.outOfStock) {
                    rows.push({
                        cartName: cart.name,
                        sectionName: secName,
                        itemName: item.name,
                        quantity: item.quantity,
                        expiry: '缺貨',
                        days: -9999,
                        daysFromToday: -9999,
                        outOfStock: true,
                        targetDate: targetDateStr,
                        note: item.note || ''
                    });
                    return;
                }
                if (isNonExpiring(item.expiry)) return;
                const target = new Date(targetDateStr); target.setHours(0,0,0,0);
                const exp = new Date(item.expiry); exp.setHours(0,0,0,0);
                const diffDays = Math.round((exp - target) / 86400000);
                if (diffDays < 90) {
                    rows.push({
                        cartName: cart.name,
                        sectionName: secName,
                        itemName: item.name,
                        quantity: item.quantity,
                        expiry: item.expiry,
                        days: diffDays,
                        daysFromToday: daysUntil(item.expiry),
                        outOfStock: false,
                        targetDate: targetDateStr,
                        note: item.note || ''
                    });
                }
            });
        });
    });
    return rows;
}

function groupMonth15RowsByCart(rows, sortBy) {
    const groups = new Map();
    const order = [];
    carts.forEach(c => {
        if (!order.includes(c.name)) order.push(c.name);
    });
    rows.forEach(r => {
        if (!groups.has(r.cartName)) groups.set(r.cartName, []);
        groups.get(r.cartName).push(r);
    });
    for (const [k, arr] of groups.entries()) {
        if (sortBy === 'name') {
            arr.sort((a, b) => {
                if (a.outOfStock && !b.outOfStock) return -1;
                if (!a.outOfStock && b.outOfStock) return 1;
                return a.itemName.localeCompare(b.itemName, 'zh-Hant');
            });
        } else {
            arr.sort((a, b) => {
                if (a.outOfStock && !b.outOfStock) return -1;
                if (!a.outOfStock && b.outOfStock) return 1;
                return (a.expiry || '').localeCompare(b.expiry || '');
            });
        }
    }
    const orderedGroups = order
        .filter(name => groups.has(name))
        .map(name => ({ name, items: groups.get(name) }));
    for (const [k, arr] of groups.entries()) {
        if (!order.includes(k)) orderedGroups.push({ name: k, items: arr });
    }
    return orderedGroups;
}

function renderTabs() {

    carts.forEach((cart, i) => {
        const active = activeTab === 'cart:' + i ? 'active' : '';
        html += `<button class="tab-btn draggable-cart ${active}" 
                         draggable="true"
                         data-tab="cart:${i}"
                         data-index="${i}"
                         title="可拖曳調整順序">🚑 ${escapeHtml(cart.name)}</button>`;
    });
    const alertCount = countExpiringItems(90);
    const alertActive = activeTab === 'overview' ? 'active' : '';
    const alertClass = alertCount > 0 ? 'tab-alert' : '';
    html += `<button class="tab-btn ${alertClass} ${alertActive}" data-tab="overview">📅 每月 15 日即將過期物品清單 (${alertCount})</button>`;

    container.innerHTML = html;

    container.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const tab = btn.getAttribute('data-tab');
            activeTab = tab;
            if (activeTab.startsWith('cart:')) {
                currentCartIndex = parseInt(activeTab.split(':')[1], 10);
            }
            render();
        });
    });

    container.querySelectorAll('.draggable-cart').forEach(btn => {
        btn.addEventListener('dragstart', e => {
            draggedCartIndex = parseInt(btn.getAttribute('data-index'), 10);
            btn.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            try { e.dataTransfer.setData('text/plain', String(draggedCartIndex)); } catch (err) {}
        });
        btn.addEventListener('dragend', () => {
            btn.classList.remove('dragging');
            container.querySelectorAll('.draggable-cart').forEach(b => b.classList.remove('drag-over'));
        });
        btn.addEventListener('dragover', e => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            if (draggedCartIndex === null) return;
            const overIndex = parseInt(btn.getAttribute('data-index'), 10);
            if (overIndex === draggedCartIndex) return;
            btn.classList.add('drag-over');
        });
        btn.addEventListener('dragleave', () => btn.classList.remove('drag-over'));
        btn.addEventListener('drop', e => {
            e.preventDefault();
            btn.classList.remove('drag-over');
            if (draggedCartIndex === null) return;
            const dropIndex = parseInt(btn.getAttribute('data-index'), 10);
            if (isNaN(dropIndex) || dropIndex === draggedCartIndex) {
                draggedCartIndex = null;
                return;
            }
            const activeCartId = (activeTab.startsWith('cart:') && carts[currentCartIndex])
                ? carts[currentCartIndex].id : null;
            const moved = carts.splice(draggedCartIndex, 1)[0];
            carts.splice(dropIndex, 0, moved);
            saveToLocalStorage();
            addLog('update', '急救車排序',
                `將「${moved.name}」從第 ${draggedCartIndex + 1} 位移到第 ${dropIndex + 1} 位`);
            if (activeCartId) {
                const newIdx = carts.findIndex(c => c.id === activeCartId);
                if (newIdx >= 0) { activeTab = 'cart:' + newIdx; currentCartIndex = newIdx; }
            }
            draggedCartIndex = null;
            render();
        });
    });
}

function countExpiringItems(days) {
    let count = 0;
    carts.forEach(cart => {
        Object.keys(cart.items).forEach(k => {
            (cart.items[k] || []).forEach(item => {
                if (item.outOfStock) { count++; return; }
                if (isNonExpiring(item.expiry)) return;
                const d = daysUntil(item.expiry);
                if (d < days) count++;
            });
        });
    });
    return count;
}

/* 每月 15 日分則 */
function renderMonth15Section() {
    const options = generateMonth15Options(12);
    if (!selectedMonth15) {
        selectedMonth15 = formatYMD(options[0]);
    }

    let selectedOpt = options.find(o => formatYMD(o) === selectedMonth15) || options[0];
    const targetDate = formatYMD(selectedOpt);

    let rows = collectItemsWithin90Days(targetDate);

    if (month15OnlyUnder30) {
        rows = rows.filter(r => {
            if (r.outOfStock) return true;
            return r.days < 30;
        });
    }

    const grouped = groupMonth15RowsByCart(rows, month15SortBy);

    const oosCount = rows.filter(r => r.outOfStock).length;
    const dangerCount = rows.filter(r => !r.outOfStock && r.days < 30).length;
    const warningCount = rows.filter(r => !r.outOfStock && r.days >= 30 && r.days < 90).length;

    const today = new Date(); today.setHours(0,0,0,0);
    const targetDateObj = new Date(selectedOpt.y, selectedOpt.m - 1, selectedOpt.d);
    const daysToTarget = Math.ceil((targetDateObj - today) / 86400000);

    let html = `
        <div class="month15-card">
            <div class="month15-title">📅 每月 15 日即將過期物品清單</div>
            <div class="month15-sub">以下列出「距離指定月份 15 日少於 90 天」的所有物品（含已過期、缺貨），依地點分類。</div>

            <div class="month15-controls">
                <label>選擇截止月份：</label>
                <select id="month15Select">
    `;
    options.forEach(opt => {
        const val = formatYMD(opt);
        const label = formatMonth15Label(opt);
        const sel = val === selectedMonth15 ? 'selected' : '';
        html += `<option value="${val}" ${sel}>${label}</option>`;
    });
    html += `
                </select>
                <button class="btn btn-sm ${month15OnlyUnder30 ? 'btn-purple' : 'btn-purple-outline'}" id="month15Toggle30Btn">
                    ${month15OnlyUnder30 ? '✓ 只顯示 <30 天' : '只顯示 <30 天'}
                </button>
                <button class="btn btn-sm ${month15SortBy === 'name' ? 'btn-purple' : 'btn-purple-outline'}" id="month15SortBtn">
                    ${month15SortBy === 'name' ? '✓ 按物品名稱排序' : '按物品名稱排序'}
                </button>
                <span class="month15-countdown">
                    距截止日：${daysToTarget >= 0 ? daysToTarget + ' 天' : '已過 ' + Math.abs(daysToTarget) + ' 天'}
                </span>
            </div>

            <div class="month15-summary">
                <div class="summary-box danger"><span class="num">${oosCount}</span>項 缺貨</div>
                <div class="summary-box danger"><span class="num">${dangerCount}</span>項 &lt;30 天</div>
                <div class="summary-box warning"><span class="num">${warningCount}</span>項 30–89 天</div>
                <div class="summary-box total"><span class="num">${rows.length}</span>項 總計</div>
            </div>
    `;

    if (rows.length === 0) {
        html += `<div class="month15-empty">🎉 截至 ${formatMonth15Label(selectedOpt)} 前 90 天內，沒有即將過期或缺貨的物品</div>`;
    } else {
        grouped.forEach(group => {
            html += `
                <div class="month15-location-header">
                    <span>🚑 ${escapeHtml(group.name)}</span>
                    <span class="count-badge">${group.items.length} 項</span>
                </div>
                <div class="table-wrapper" style="padding:0;">
                    <table>
                        <thead>
                            <tr>
                                <th style="width:18%">區域</th>
                                <th style="width:22%">物品名稱</th>
                                <th style="width:7%">數量</th>
                                <th style="width:12%">有效日期</th>
                                <th style="width:15%">備註</th>
                                <th style="width:14%">狀態</th>
                                <th style="width:12%">距截止日</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            group.items.forEach(r => {
                let rowClass, statusText, statusColor, statusClass;
                if (r.outOfStock) {
                    rowClass = 'row-outofstock';
                    statusText = '缺貨';
                    statusColor = '#b33a3a';
                    statusClass = 'status-danger';
                } else if (r.days < 0) {
                    rowClass = 'row-danger';
                    statusText = `已過期 ${Math.abs(r.days)} 天`;
                    statusColor = '#b33a3a';
                    statusClass = 'status-danger';
                } else if (r.days < 30) {
                    rowClass = 'row-danger';
                    statusText = `${r.days} 天`;
                    statusColor = '#b33a3a';
                    statusClass = 'status-danger';
                } else if (r.days < 90) {
                    rowClass = 'row-warning';
                    statusText = `${r.days} 天`;
                    statusColor = '#8a6d00';
                    statusClass = 'status-warning';
                } else {
                    rowClass = '';
                    statusText = `${r.days} 天`;
                    statusColor = '#2a4d62';
                    statusClass = '';
                }
                html += `
                    <tr class="item-row ${rowClass}">
                        <td style="font-size:0.9rem;">${escapeHtml(r.sectionName)}</td>
                        <td>${escapeHtml(r.itemName)}</td>

                        <td>${r.expiry}</td>

                    </tr>
                `;
            });
            html += `</tbody></table></div>`;
        });
    }

    html += `</div>`;
    return html;
}

/* ============================================================

   ============================================================ */
function exportAllToJson() {
    const backup = {
        version: 2,
        exportedAt: new Date().toISOString(),
        exportedBy: currentUser || '未知',
        carts: carts.map(cart => ({
            id: cart.id,
            name: cart.name,
            sectionNames: cart.sectionNames || {},
            sectionOrder: cart.sectionOrder || Object.keys(cart.items),
            items: Object.keys(cart.items).reduce((acc, k) => {
                acc[k] = (cart.items[k] || []).map(it => ({
                    id: it.id,
                    name: it.name,
                    quantity: it.quantity,
                    expiry: it.expiry || '',
                    outOfStock: !!it.outOfStock,
                    note: it.note || '',
                    lockNo: it.lockNo || ''
                }));
                return acc;
            }, {})
        }))
    };

    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    const filename = `急救車全部備份_${new Date().toISOString().slice(0,10)}.json`;
    safeSaveAs(blob, filename);
    addLog('update', '備份', `匯出全部資料備份（${carts.length} 台）`);
    alert(`已匯出全部資料備份：${filename}\n共 ${carts.length} 台急救車`);
}

/* ============================================================
   匯入 JSON
   ============================================================ */
function importFromJson(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const text = e.target.result;
            const data = JSON.parse(text);

            let incomingCarts = null;
            if (Array.isArray(data)) {
                incomingCarts = data;
            } else if (data && Array.isArray(data.carts)) {
                incomingCarts = data.carts;
            }

            if (!incomingCarts || incomingCarts.length === 0) {
                alert('匯入失敗：檔案內容不是有效的備份格式（找不到 carts 陣列）。');
                return;
            }

            const validCarts = [];
            incomingCarts.forEach((c, idx) => {
                if (!c || typeof c !== 'object') return;
                if (!c.items || typeof c.items !== 'object') return;
                const newId = c.id || genId('cart');
                const items = {};
                Object.keys(c.items).forEach(k => {
                    const arr = Array.isArray(c.items[k]) ? c.items[k] : [];
                    items[k] = arr.map(it => ({
                        id: it.id || genId('item'),
                        name: it.name || '未命名物品',
                        quantity: typeof it.quantity === 'number' ? it.quantity : (parseInt(it.quantity, 10) || 0),
                        expiry: it.expiry || '',
                        outOfStock: !!it.outOfStock,
                        note: it.note || '',
                        lockNo: it.lockNo || ''
                    }));
                });
                const sectionNames = c.sectionNames && typeof c.sectionNames === 'object' ? { ...c.sectionNames } : {};
                Object.keys(items).forEach(k => {
                    if (!sectionNames[k]) {
                        const def = SECTION_DEFS.find(s => s.key === k);
                        sectionNames[k] = def ? def.name : k;
                    }
                });
                let sectionOrder = Array.isArray(c.sectionOrder) ? c.sectionOrder.slice() : Object.keys(items);
                Object.keys(items).forEach(k => {
                    if (!sectionOrder.includes(k)) sectionOrder.push(k);
                });
                sectionOrder = sectionOrder.filter(k => items[k] !== undefined);
                validCarts.push({
                    id: newId,
                    name: c.name || `匯入的急救車 ${idx + 1}`,
                    items,
                    sectionNames,
                    sectionOrder
                });
            });

            if (validCarts.length === 0) {
                alert('匯入失敗：沒有有效的急救車資料。');
                return;
            }

            const mode = confirm(
                `讀取到 ${validCarts.length} 台急救車。\n\n` +
                `按「確定」→ 覆蓋全部（清空現有資料，改用備份檔）\n` +
                `按「取消」→ 合併新增（保留現有資料，把備份檔的車加進去）`
            );

            if (mode) {
                carts = validCarts;
                saveToLocalStorage();
                addLog('update', '備份', `匯入 JSON 備份（覆蓋全部，共 ${validCarts.length} 台）`);
                alert(`已覆蓋全部資料，共 ${validCarts.length} 台急救車。`);
            } else {
                validCarts.forEach(c => {
                    if (carts.some(x => x.id === c.id)) {
                        c.id = genId('cart');
                    }
                    carts.push(c);
                });
                saveToLocalStorage();
                addLog('update', '備份', `匯入 JSON 備份（合併新增，共 ${validCarts.length} 台）`);
                alert(`已合併新增 ${validCarts.length} 台急救車。`);
            }

            activeTab = 'cart:0';
            currentCartIndex = 0;
            render();
        } catch (err) {
            console.error(err);
            alert('匯入失敗：' + err.message);
        }
    };
    reader.readAsText(file, 'utf-8');
}

            table { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
            th { background: #ede4ff; border: 1px solid #888; padding: 4px 5px; font-size: 9.5pt; text-align: left; font-weight: bold; }
            td { border: 1px solid #888; padding: 4px 5px; font-size: 9.5pt; vertical-align: top; }
            .danger { background: #ffe1e1; color: #a00; font-weight: bold; }
            .warning { background: #fff8d6; color: #8a6d00; font-weight: bold; }
            .oos { background: #ffcccc; color: #a00; font-weight: bold; }
            .note { font-size: 9pt; color: #333; margin-top: 14px; text-align: center; }
        </style>
    `;

    let bodyHtml = `<h1>📅 每月 15 日即將過期物品清單</h1>`;
    bodyHtml += `<h2>截止日期：${formatMonth15Label(selectedOpt)}（顯示距離截止日 90 天內）${month15OnlyUnder30 ? '，只顯示 <30 天' : ''}${month15SortBy === 'name' ? '，按物品名稱排序' : ''}</h2>`;
    bodyHtml += `<div class="summary">
                    <span style="color:#a00;">🔴 缺貨：${oosCount} 項</span>
                    <span style="color:#a00;">🔴 &lt;30 天：${dangerCount} 項</span>
                    <span style="color:#8a6d00;">🟡 30–89 天：${warningCount} 項</span>
                    <span style="color:#1e4a5f;">📦 總計：${total} 項</span>
                 </div>`;

    if (total === 0) {
        bodyHtml += `<p style="text-align:center; color:#8aa9bb; padding:20px;">🎉 截至此截止日前 90 天內，沒有即將過期或缺貨的物品</p>`;
    } else {
        grouped.forEach(group => {
            bodyHtml += `<div class="location-title">🚑 ${escapeHtml(group.name)}<span class="location-count">（${group.items.length} 項）</span></div>`;
            bodyHtml += `<table><thead><tr>
                            <th style="width:40%">物品名稱</th>
                            <th style="width:10%">數量</th>
                            <th style="width:18%">有效日期</th>
                            <th style="width:20%">備註</th>
                            <th style="width:12%">狀態</th>
                         </tr></thead><tbody>`;
            group.items.forEach(r => {
                let cls, statusText;
                if (r.outOfStock) {
                    cls = 'oos'; statusText = '缺貨';
                } else if (r.days < 0) {
                    cls = 'danger'; statusText = `已過期 ${Math.abs(r.days)} 天`;
                } else if (r.days < 30) {
                    cls = 'danger'; statusText = `${r.days} 天`;
                } else if (r.days < 90) {
                    cls = 'warning'; statusText = `${r.days} 天`;
                } else {
                    cls = ''; statusText = `${r.days} 天`;
                }
                bodyHtml += `<tr class="${cls}">
                                <td>${escapeHtml(r.itemName)}</td>
                                <td style="text-align:center;">${r.quantity}</td>
                                <td>${r.expiry}</td>
                                <td>${escapeHtml(r.note || '')}</td>
                                <td>${statusText}</td>
                             </tr>`;
            });
            bodyHtml += `</tbody></table>`;
        });
    }

    bodyHtml += `<div class="note">匯出日期：${new Date().toLocaleDateString('zh-TW')}</div>`;

    const fullHtml = `
        <html xmlns:o="urn:schemas-microsoft-com:office:office" 
              xmlns:w="urn:schemas-microsoft-com:office:word" 
              xmlns="http://www.w3.org/TR/REC-html40">
        <head><meta charset="utf-8"><title>每月15日即將過期物品清單</title>${docStyles}</head>
        <body>${bodyHtml}</body></html>
    `;

    const blob = new Blob(['\ufeff', fullHtml], { type: 'application/msword' });
    const filename = `每月15日即將過期物品清單_${formatMonth15Label(selectedOpt).replace(/\//g,'-')}${month15OnlyUnder30 ? '_30天內' : ''}${month15SortBy === 'name' ? '_按名稱' : ''}_${new Date().toISOString().slice(0,10)}.doc`;
    safeSaveAs(blob, filename);
    addLog('update', '每月15日清單', `匯出每月 15 日即將過期物品清單（${formatMonth15Label(selectedOpt)}）`);
}
